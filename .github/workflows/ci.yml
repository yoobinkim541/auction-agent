name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  engine:
    name: typecheck + tests (TS engine)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json
      - run: npm ci
      # 루트 vitest 가 web/src 테스트도 돌린다. 그 모듈들이 react 를 import 하므로 web 의존성이 필요하다.
      - run: npm ci
        working-directory: web
      - run: npm run typecheck
      - run: npm test

  web:
    name: build (dashboard)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build
